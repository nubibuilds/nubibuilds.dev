# Move this file to .github/workflows/ci.yml to turn it on (GitHub only runs workflows from that folder).

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  # A newer push cancels older runs, except on main, so a deploy is never cut off halfway.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    name: Check, build, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm version comes from `packageManager` in package.json (same as Cloudflare Workers Builds).
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm check

      - name: Build
        run: pnpm build

      - name: Install browser for end-to-end tests
        run: pnpm exec playwright install --with-deps chromium

      - name: End-to-end tests
        run: pnpm test:e2e

      - name: Lighthouse budgets
        run: pnpm exec lhci autorun

      # The deploy job publishes exactly this tested build, not a fresh one.
      - name: Upload site for deploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist
          if-no-files-found: error
          retention-days: 7

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            .lighthouseci
            test-results
            playwright-report
          if-no-files-found: ignore
          include-hidden-files: true

  deploy:
    name: Deploy to Cloudflare
    # Runs only on pushes to main, and only when every check above passed.
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://nubibuilds.dev
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Installs the wrangler version pinned in package.json, which the action then uses.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download tested site
        uses: actions/download-artifact@v4
        with:
          name: site
          path: dist

      - name: Deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          packageManager: pnpm
          command: deploy
